{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTrail - New Document Request</title>
    <link rel="stylesheet" href="{% static 'css/home/home.css' %}">
    <style>
        .form-card { background: white; max-width: 600px; width: 100%; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; margin: 2rem auto; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #4f46e5; outline: none; }
        .btn-submit { width: 100%; background: #4f46e5; color: white; padding: 0.8rem; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; transition: 0.15s; }
        .btn-submit:hover { background: #4338ca; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand"><span>📄</span> PaperTrail</div>
            <div class="nav-links">
                <a href="{% url 'home:home' %}">Home</a>
                <a href="{% url 'documents:create' %}" class="active">New Request</a>
                <a href="{% url 'profile:profile' %}">Profile</a>
                <a href="{% url 'user_settings:settings' %}">Settings</a>
                <a href="{% url 'home:logout' %}" class="btn-logout">Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span style="font-size: 2.5rem;">📝</span>
                <h2 style="font-size: 1.5rem; font-weight: 800; color: #1e293b; margin-top: 0.5rem;">Submit New Document</h2>
                <p style="font-size: 0.85rem; color: #64748b;">Initiate a multi-stage university tracking workflow</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Select Document Processing Workflow</label>
                    <select name="template_id" required>
                        {% for t in templates %}
                            <option value="{{ t.id }}">{{ t.title }} (~{{ t.estimated_total_days }} days SLA)</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Document Title</label>
                    <input type="text" name="document_title" placeholder="e.g., Cross-Enrollment Endorsement Form" required>
                </div>

                <div class="form-group">
                    <label>Purpose of Request</label>
                    <textarea name="purpose" rows="3" placeholder="Provide background or justification for this document submission..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Generate Tracking ID & Submit</button>
            </form>
        </div>
    </main>
</body>
</html>
