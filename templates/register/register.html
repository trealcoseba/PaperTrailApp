{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTrail - Create Account</title>
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand"><span>📄</span> PaperTrail</div>
            <div class="nav-links">
                <a href="{% url 'login:login' %}" class="inactive-link">Login</a>
                <a href="{% url 'register:register' %}" class="btn-reg">Register</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="card">
            <div class="card-header">
                <h2>Create an Account</h2>
                <p>Register to start submitting document requests</p>
            </div>

            {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="last_name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">Register Account</button>
            </form>

            <div class="footer-text">
                Already have an account? <a href="{% url 'login:login' %}">Back to Login</a>
            </div>
        </div>
    </main>
    <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
