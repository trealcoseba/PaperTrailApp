{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTrail - User Settings</title>
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand"><span>📄</span> PaperTrail</div>
            <div class="nav-links">
                <a href="{% url 'home:home' %}">Home</a>
                <a href="{% url 'profile:profile' %}">Profile</a>
                <a href="{% url 'user_settings:settings' %}" class="active">Settings</a>
                <a href="{% url 'home:logout' %}" class="btn-logout">Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="card">
            <div class="header-row">
                <div class="avatar-badge">⚙️</div>
                <div>
                    <h2>User Settings</h2>
                    <p>Configure your app preferences</p>
                </div>
            </div>

            {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}

            <form method="post">
                {% csrf_token %}
                <label class="setting-option">
                    <input type="checkbox" name="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
                    <div>
                        <div class="option-title">Enable Dark Mode</div>
                        <div class="option-desc">Adjust the interface to reduce eye strain</div>
                    </div>
                </label>

                <label class="setting-option">
                    <input type="checkbox" name="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
                    <div>
                        <div class="option-title">Email Notifications</div>
                        <div class="option-desc">Receive alert when documents change status</div>
                    </div>
                </label>

                <button type="submit" class="btn-primary">Save Preferences</button>
            </form>
        </div>
    </main>
    <script src="{% static 'js/user_settings/settings.js' %}"></script>
</body>
</html>
