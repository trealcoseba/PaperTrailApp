{% extends 'accounts/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Create an Account</h2>
        <p>Register to submit and monitor requests</p>
    </div>

    {% if form.errors %}
        <div class="error-msg">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" required>
            </div>
        {% endfor %}

        <button type="submit" class="btn-submit">Register Account</button>
    </form>

    <div class="card-footer">
        Already have an account? <a href="{% url 'login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}
