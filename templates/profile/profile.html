{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperTrail - User Profile</title>
    <link rel="stylesheet" href="{% static 'css/profile/profile.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand"><span>📄</span> PaperTrail</div>
            <div class="nav-links">
                <a href="{% url 'home:home' %}">Home</a>
                <a href="{% url 'profile:profile' %}" class="active">Profile</a>
                <a href="{% url 'user_settings:settings' %}">Settings</a>
                <a href="{% url 'home:logout' %}" class="btn-logout">Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="card">
            <div class="header-row">
                <div class="avatar-badge">👤</div>
                <div>
                    <h2>User Profile</h2>
                    <p>Manage your university student profile</p>
                </div>
            </div>

            {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" value="{{ user.username }}" disabled>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" value="{{ profile.full_name }}" required>
                </div>
                <div class="form-group">
                    <label>Bio / Department</label>
                    <textarea name="bio" rows="3">{{ profile.bio }}</textarea>
                </div>
                <button type="submit" class="btn-primary">Save Profile</button>
            </form>
        </div>
    </main>
    <script src="{% static 'js/profile/profile.js' %}"></script>
</body>
</html>
